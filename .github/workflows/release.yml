name: Generate and Draft Release APK
# on push with tag "v*" do jobs
on:
  push:
    tags:
      - 'v*' 

jobs:
  build-and-draft:
    runs-on: ubuntu-latest
    
   
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Build Release APK
        run: ./gradlew assembleRelease


      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Connect_4_${{ github.ref_name }}.apk

      - name: Create Draft Release & Upload APK
        uses: softprops/action-gh-release@v3
        with:
          draft: true 
          generate_release_notes: true
          files: app/build/outputs/apk/release/Connect_4_*.apk
